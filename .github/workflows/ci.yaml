name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate YAML, Kubernetes and Helm
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install yamllint
        run: pip install yamllint

      - name: Validate YAML syntax and style
        run: yamllint .

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.37.1"

      - name: Set up kubeconform
        uses: bmuschko/setup-kubeconform@v1
        with:
          kubeconform-version: "0.8.0"

      - name: Validate Kubernetes manifests
        run: |
          find . -type f \( \
            -name '*.yaml' -o -name '*.yml' \
          \) \
            -not -path './.git/*' \
            -not -path './helm/*/templates/*' \
            -print0 |
          xargs -0 -r kubeconform \
            -strict \
            -summary \
            -kubernetes-version 1.37.1

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.16.4"

      - name: Validate Helm charts
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' chart; do
            echo "Linting $chart"
            helm lint "$chart"

            echo "Rendering $chart"
            helm template ci "$chart" \
              --namespace default \
              > /dev/null
          done < <(find helm -name Chart.yaml -print0)

      - name: Validate Argo CD Application structure
        run: |
          find argocd -type f \( \
            -name '*.yaml' -o -name '*.yml' \
          \) -print0 |
          xargs -0 -r kubeconform \
            -strict \
            -summary \
            -kubernetes-version 1.37.1 \
            -schema-location default \
            -schema-location \
              'https://raw.githubusercontent.com/argoproj/argo-cd/master/manifests/crds/application-crd.yaml'
